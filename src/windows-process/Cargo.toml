[package]
name = "bonsai-windows-process"
version = "0.1.5"
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
keywords = ["windows", "process", "job-object", "supervision"]
categories = ["os::windows-apis"]
description = "Windows Job ownership and bounded native process lifecycle for Bonsai"

[target.'cfg(windows)'.dependencies]
ash.workspace = true
bonsai-neon-dot.workspace = true
bonsai-ternary.workspace = true
flatbuffers = "=25.12.19"
hex.workspace = true
mxc-sdk = { version = "=1.0.1", default-features = false }
windows-sys = { workspace = true, features = ["Wdk_Graphics_Direct3D", "Wdk_System_SystemServices", "Wdk_System_Threading", "Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_Isolation", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Power", "Win32_System_Performance", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[features]
test-probe = ["windows-sys/Win32_System_Diagnostics_Debug"]

[[bin]]
name = "bonsai-process-test-probe"
path = "tests/support/probe.rs"
required-features = ["test-probe"]
test = false
doc = false

[[bin]]
name = "bonsai-push-recovery"
path = "src/bin/bonsai-push-recovery.rs"
doc = false

[lints]
workspace = true
