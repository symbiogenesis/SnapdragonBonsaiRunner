[package]
name = "bonsai-speech-asr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["speech", "asr", "qwen3", "gguf", "native"]
categories = ["multimedia::audio"]
description = "Bounded native Qwen3-ASR 1.7B recognition for Bonsai speech services"

[lib]
doctest = false

[features]
default = ["native-engine"]
# Production remains on the independently retained native control engine.
native-engine = ["dep:bonsai-speech-service", "dep:serde_json", "dep:transcribe-cpp"]
# Explicit qualification binary; never selected by application provisioning.
rust-qualification = ["dep:bonsai-artifacts", "dep:bonsai-cpu-policy", "dep:bonsai-speech-service", "dep:hex", "dep:serde", "dep:serde_json"]

[[bin]]
name = "bonsai-speech-asr"
path = "src/main.rs"
required-features = ["native-engine"]
test = false

[[bin]]
name = "bonsai-asr-rust-qualification"
path = "src/rust_main.rs"
required-features = ["rust-qualification"]

[[bin]]
name = "bonsai-asr-replay"
path = "src/replay_main.rs"
required-features = ["rust-qualification"]
test = false

[dependencies]
bonsai-artifacts = { workspace = true, optional = true }
bonsai-cpu-policy = { workspace = true, optional = true }
bonsai-gguf.workspace = true
bonsai-native-hash.workspace = true
bonsai-neon-dot.workspace = true
bonsai-speech-service = { workspace = true, optional = true }
bonsai-ternary.workspace = true
fearless_simd.workspace = true
hex = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
transcribe-cpp = { version = "=0.4.1", default-features = false, optional = true }

[dev-dependencies]
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
bonsai-windows-process = { workspace = true, features = ["quant-kernels"] }

[lints]
workspace = true
