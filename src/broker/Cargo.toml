[package]
name = "bonsai-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded development chat transport and request supervision for the Bonsai broker"

[lib]
doctest = false

[[bin]]
name = "bonsai-broker"
path = "src/main.rs"
# CLI behavior is covered by integration tests; this root has no unit tests.
test = false

[dependencies]
bonsai-artifacts.workspace = true
bonsai-cpu-policy.workspace = true
http = "=1.5.0"
httparse.workspace = true
memchr.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "signal", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
bonsai-markdown.workspace = true
bonsai-windows-process.workspace = true
bonsai-windows-credentials.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
