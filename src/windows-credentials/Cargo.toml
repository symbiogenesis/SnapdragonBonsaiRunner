[package]
name = "bonsai-windows-credentials"
version = "0.1.9"
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
keywords = ["windows", "credentials", "security"]
categories = ["os::windows-apis"]
description = "Private Windows credential provisioning for the Bonsai development launcher"

[lib]
doctest = false

[dependencies]
bonsai-native-hash.workspace = true
hex.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
zeroize.workspace = true

[lints]
workspace = true
