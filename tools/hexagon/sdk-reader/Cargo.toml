[package]
name = "bonsai-sdk-reader"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Bounded data-only Hexagon SDK archive stream"

[workspace]

[dependencies]
lzma-rust2 = { version = "=0.25.0", default-features = false, features = ["std", "xz"] }
tar = { version = "=0.4.46", default-features = false }
serde_json = "=1.0.154"
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.1", default-features = false }
unicode-casefold = "=0.2.0"

[profile.release]
overflow-checks = true
debug-assertions = false

# Match dev and test profiles so check/build/run and test share compiled
# dependencies, keep workspace crates incremental below opt-level = 3 (avoiding
# the AArch64 Windows incremental + O3 SEH unwind bug), and cut Windows PDB I/O.
[profile.dev]
opt-level = 1
overflow-checks = true
debug-assertions = true
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.test]
opt-level = 1
overflow-checks = true
debug-assertions = true
debug = "line-tables-only"

[profile.test.package."*"]
opt-level = 2
debug = 0
