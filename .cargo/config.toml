# Portable application binaries carry their CRT; users install no VC++ runtime.
# Parallel rustc frontend (-Z threads=8) speeds up large single-crate and
# cold-workspace builds on pinned 1.102-nightly; remove or migrate to
# --jobs-frontend when moving to beta/stable.
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-Z", "threads=8"]
