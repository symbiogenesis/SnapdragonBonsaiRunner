[workspace]
resolver = "3"
members = [
    "src/broker",
    "src/chat-ui",
    "src/markdown",
    "src/speech-asr",
    "src/speech-tts",
    "src/speech-service",
    "src/audio",
    "src/artifacts",
    "src/cpu-policy",
    "src/windows-process",
    "src/windows-credentials",
    "tools/bonsai",
    "tools/ci",
]

[workspace.package]
version = "0.3.7"
edition = "2024"
# The pinned nightly provides Polonius lending and the next-generation trait solver.
rust-version = "1.101"
publish = false
license = "Apache-2.0"
repository = "https://github.com/symbiogenesis/SnapdragonBonsaiRunner"

[workspace.dependencies]
ash = { version = "=0.38.0", default-features = false }
base64ct = { version = "=1.8.3", default-features = false, features = ["alloc"] }
bonsai-artifacts = { path = "src/artifacts" }
bonsai-gguf = { version = "=0.1.11", default-features = false }
bonsai-native-hash = "=0.1.8"
bonsai-neon-dot = "=0.1.11"
bonsai-ternary = "=0.1.7"
bonsai-audio = { path = "src/audio" }
bonsai-cpu-policy = { path = "src/cpu-policy" }
bonsai-markdown = { path = "src/markdown" }
bonsai-speech-service = { path = "src/speech-service" }
bonsai-windows-credentials = { version = "=0.1.9", path = "src/windows-credentials" }
bonsai-windows-process = { version = "=0.1.8", path = "src/windows-process" }
epaint_default_fonts = { version = "=0.37.0", default-features = false }
fearless_simd = "=1.2.0"
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }
hex = "=0.4.3"
httparse = "=1.10.1"
memchr = { version = "=2.8.3", default-features = false }
png = { version = "=0.18.1", default-features = false }
resvg = { version = "=0.50.0", default-features = false, features = ["text"] }
serde = "=1.0.229"
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
subtle = "=2.6.1"
tokio = "=1.54.1"
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde", "std"] }
ureq = { version = "=3.5.2", default-features = false }
windows-sys = "=0.61.2"
winresource = { version = "=0.1.34", default-features = false }
zeroize = { version = "=1.9.1", default-features = false }
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Bounds must fail visibly in optimized builds rather than wrap silently.
[profile.release]
overflow-checks = true
# Preserve subtle's constant-time release contract.
debug-assertions = false

# Match dev and test profiles so check/build/run and test share compiled
# dependencies, keep workspace crates incremental below opt-level = 3 (avoiding
# the AArch64 Windows incremental + O3 SEH unwind bug), and cut Windows PDB I/O.
[profile.dev]
opt-level = 1
overflow-checks = true
debug-assertions = true
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.test]
opt-level = 1
overflow-checks = true
debug-assertions = true
debug = "line-tables-only"

[profile.test.package."*"]
opt-level = 2
debug = 0

# Native-boundary crates permit individually documented unsafe operations.
# Safe package target roots additionally forbid unsafe code.
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
non_ascii_idents = "forbid"
# Native-boundary unsafe allowances must never waive these safety checks.
unsafe_op_in_unsafe_fn = "forbid"
invalid_reference_casting = "forbid"
static_mut_refs = "forbid"
ffi_unwind_calls = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
missing_docs = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
unused_import_braces = "deny"
meta_variable_misuse = "deny"

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }

[workspace.lints.clippy]
# Block defects and inefficient operations without turning new style preferences
# into failures through Rust's warnings policy. Individual safety/ownership
# requirements below take precedence over these category defaults.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
cargo = { level = "allow", priority = -1 }
# Preserve named allowances for historical nonsemantic failures.
unreadable_literal = "allow"
missing_const_for_fn = "allow"
semicolon_if_nothing_returned = "allow"
# Wire field names, independent selection flags and source line counts are not
# correctness contracts. Grouping heuristics also misread run/job API identities.
struct_field_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
suspicious_operation_groupings = "allow"
# Nursery lint with false positives on edition-2024/Polonius borrow paths.
redundant_clone = "allow"
as_conversions = "deny"
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
print_stdout = "deny"
print_stderr = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
allow_attributes_without_reason = "deny"
