name: Snapdragon X2 CPU thread screening
on:
  workflow_dispatch:
    inputs:
      run_device:
        description: Run the single five-minute X2 screen after hosted preparation
        type: boolean
        default: false
      observe_output_progress:
        description: Capture output/memory attribution separately, suppressing timing ratios
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  # Hosted preparation never occupies the shared physical-device lane.
  group: ${{ inputs.run_device && 'swift-lora-snapdragon' || format('x2-cpu-hosted-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/bonsai-tools
      - uses: $/.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-11-26-aarch64-pc-windows-msvc
      - name: Check native X2 observation, deadline and pair-comparison controls
        shell: pwsh
        run: cargo +nightly-2026-11-26 test --locked --release --target-dir $env:BONSAI_TOOLS_TARGET -p bonsai-tools --lib cpu_evaluation
      - name: Bind checked tools to this exact source revision
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-CheckedTools'
          [void][IO.Directory]::CreateDirectory($package)
          $tool = Join-Path $package 'bonsai-tools.exe'
          $numeric = Join-Path $package 'bonsai-reference-numerics.exe'
          $probe = Join-Path $package 'bonsai-completion-test-probe.exe'
          Copy-Item -LiteralPath $env:BONSAI_TOOLS_PATH -Destination $tool
          Copy-Item -LiteralPath $env:BONSAI_REFERENCE_NUMERIC_TOOL -Destination $numeric
          Copy-Item -LiteralPath $env:BONSAI_COMPLETION_PROBE_PATH -Destination $probe
          @{
            SchemaVersion = 3; Revision = $env:GITHUB_SHA
            Sha256 = (Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant()
            NumericSha256 = (Get-FileHash -LiteralPath $numeric -Algorithm SHA256).Hash.ToLowerInvariant()
            ProbeSha256 = (Get-FileHash -LiteralPath $probe -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $package 'receipt.json') -Encoding utf8NoBOM
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bonsai-tools-windows-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/SwiftBonsai-CheckedTools
          if-no-files-found: error
          retention-days: 90
  evaluate:
    needs: prepare
    if: github.ref == 'refs/heads/main' && inputs.run_device
    # Register one ephemeral owner runner for this exact run only. A generic
    # restored runner could accidentally accept historical queued model jobs.
    runs-on: [self-hosted, Windows, ARM64, "x2-cpu-${{ github.run_id }}"]
    timeout-minutes: 5
    steps:
      - name: Admit the original source-bound pre-bootstrap owner receipt
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $request = @{ operation = 'ci-owner-admit'; startReceipt = $env:BONSAI_X2_OWNER_START_RECEIPT }
          & $env:BONSAI_TOOLS_PATH cpu-evaluation --json (ConvertTo-Json -InputObject $request -Compress)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/use-bonsai-tools
      - name: Capture bounded X2 Elite Extreme thread pairs
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          BONSAI_X2_ATTRIBUTION: ${{ inputs.observe_output_progress }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # CIM is the independent Windows environment observation. Rust admits
          # its typed name/count and owns clocks, credential removal and Jobs.
          $processors = @(Get-CimInstance Win32_Processor -Property Name, NumberOfLogicalProcessors -OperationTimeoutSec 10 |
            ForEach-Object { @{ name = $_.Name; logicalProcessors = [int]$_.NumberOfLogicalProcessors } })
          $request = @{ operation = 'ci-capture'; startReceipt = $env:BONSAI_X2_OWNER_START
            dataDirectory = (Join-Path $env:LOCALAPPDATA 'SwiftBonsai2'); cimProcessors = $processors
            attributionInput = $env:BONSAI_X2_ATTRIBUTION }
          & $env:BONSAI_TOOLS_PATH cpu-evaluation --json (ConvertTo-Json -InputObject $request -Depth 8 -Compress)
      - name: Retain credential-free synthetic CPU evidence
        if: always() && env.BONSAI_X2_CPU_EVIDENCE != '' && env.BONSAI_X2_UPLOAD_ALLOWED == 'true'
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x2-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          # Explicit text/JSON evidence only; the verified adapter copy is excluded.
          path: |
            ${{ env.BONSAI_X2_CPU_EVIDENCE }}/**/*.json
            ${{ env.BONSAI_X2_CPU_EVIDENCE }}/**/*.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Confirm original X2 deadline and power through bounded upload
        if: always() && env.BONSAI_X2_OWNER_START != ''
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:BONSAI_TOOLS_PATH cpu-evaluation --json (@{ operation = 'ci-owner-finalize'; startReceipt = $env:BONSAI_X2_OWNER_START } | ConvertTo-Json -Compress)
