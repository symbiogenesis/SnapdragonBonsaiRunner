name: Native Windows sandbox qualification
on:
  workflow_dispatch:
    inputs:
      target:
        description: Model-free native capability and process-lifetime checks
        type: choice
        options: [hosted-arm64, snapdragon]
        default: hosted-arm64
permissions:
  contents: read
concurrency:
  # Owner process trials share the laptop lane with performance captures.
  group: ${{ inputs.target == 'snapdragon' && 'swift-lora-snapdragon' || 'sandbox-qualification-hosted-arm64' }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    # Preparation and execution retain the original thirty-minute hosted cap.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/bonsai-tools
      - uses: $/.github/actions/rust-toolchain
        id: compiler
        with:
          toolchain: nightly-2026-11-12-aarch64-pc-windows-msvc
      - uses: $/.github/actions/ci-tool
      - name: Select external preparation paths
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ('Sandbox-Preparation-' + [guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($root)
          "BONSAI_SANDBOX_PACKAGE=$(Join-Path $root 'package')" >> $env:GITHUB_ENV
          "BONSAI_SANDBOX_PREPARATION_EVIDENCE=$(Join-Path $root 'evidence')" >> $env:GITHUB_ENV
      - name: Reuse compatible native sandbox build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/Bonsai-Sandbox-Target
          key: sandbox-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.image-identity }}-nightly-2026-11-12-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/**', 'src/**', 'tools/bonsai/**', 'tools/ci/**', '.github/workflows/sandbox-qualification.yml') }}-content-v1
          restore-keys: |
            sandbox-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.image-identity }}-nightly-2026-11-12-
      - name: Prepare the exact source-bound native sandbox fixtures
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:BONSAI_TOOLS_PATH sandbox-qualification --json (@{
            operation = 'prepare'; repositoryRoot = $env:GITHUB_WORKSPACE
            buildDirectory = Join-Path $env:RUNNER_TEMP 'Bonsai-Sandbox-Target'
            outputDirectory = $env:BONSAI_SANDBOX_PACKAGE
            evidenceDirectory = $env:BONSAI_SANDBOX_PREPARATION_EVIDENCE
          } | ConvertTo-Json -Compress)
      - name: Publish only the five native executables and their receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-sandbox-bin-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BONSAI_SANDBOX_PACKAGE }}/sandbox-ownership.exe
            ${{ env.BONSAI_SANDBOX_PACKAGE }}/sandbox-contained.exe
            ${{ env.BONSAI_SANDBOX_PACKAGE }}/bonsai-process-test-probe.exe
            ${{ env.BONSAI_SANDBOX_PACKAGE }}/bonsai-tools.exe
            ${{ env.BONSAI_SANDBOX_PACKAGE }}/bonsai-ci.exe
            ${{ env.BONSAI_SANDBOX_PACKAGE }}/receipt.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Retain selected preparation evidence
        if: always() && env.BONSAI_SANDBOX_PREPARATION_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-sandbox-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BONSAI_SANDBOX_PREPARATION_EVIDENCE }}/*.json
            ${{ env.BONSAI_SANDBOX_PREPARATION_EVIDENCE }}/*.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
  qualify:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(inputs.target == 'snapdragon' && '["self-hosted","Windows","ARM64","swift-bonsai-snapdragon"]' || '"windows-11-arm"') }}
    timeout-minutes: 5
    steps:
      - name: Record the original aggregate clock and fixed workload
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          "BONSAI_SANDBOX_JOB_STARTED_TICK=$([Diagnostics.Stopwatch]::GetTimestamp())" >> $env:GITHUB_ENV
          "BONSAI_SANDBOX_JOB_STARTED_UTC=$([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_ENV
          @('Fixed workload: six model-free native sandbox controls from this run''s prebuilt package.',
            'Conservative estimate: 240 seconds total (180 fixed case work plus 60 for intake, inventories, power, teardown and evidence).',
            'Original aggregate maximum: 300 seconds; no compiler or model runs in this job.',
            'AC status before native bootstrap is unknown; native entry/exit and every selected case retain separate observations.') |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's exact prebuilt sandbox package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-sandbox-bin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/Native-Sandbox-Package-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify native helper trust and run the fixed qualification
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          SANDBOX_TARGET: ${{ inputs.target }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $package = Join-Path $env:RUNNER_TEMP "Native-Sandbox-Package-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          # Pre-execution trust is checked before running the downloaded helper.
          $receiptPath = Join-Path $package 'receipt.json'
          if ((Get-Item -LiteralPath $receiptPath).Length -gt 65536) { throw 'Sandbox bootstrap receipt exceeds its bound.' }
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          if ($receipt.SchemaVersion -ne 1 -or $receipt.Kind -cne 'native-sandbox-prebuilt-package' -or
              $receipt.Revision -cne $env:GITHUB_SHA -or $receipt.RunId -cne $env:GITHUB_RUN_ID -or
              $receipt.RunAttempt -cne $env:GITHUB_RUN_ATTEMPT -or
              $receipt.Toolchain -cne 'nightly-2026-11-12-aarch64-pc-windows-msvc') { throw 'Sandbox bootstrap source/run identity differs.' }
          $identity = @($receipt.Files | Where-Object Name -CEQ 'bonsai-tools.exe')
          $tool = Join-Path $package 'bonsai-tools.exe'
          if ($identity.Count -ne 1 -or $identity[0].Bytes -le 0 -or $identity[0].Bytes -gt 134217728 -or
              $identity[0].Sha256 -cnotmatch '^[a-f0-9]{64}$' -or
              (Get-Item -LiteralPath $tool).Length -ne $identity[0].Bytes -or
              (Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant() -cne $identity[0].Sha256) { throw 'Sandbox bootstrap helper identity differs.' }
          $root = Join-Path $env:RUNNER_TEMP ('Sandbox-Qualification-' + [guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($root)
          $evidence = Join-Path $root 'evidence'
          "BONSAI_SANDBOX_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          & $tool sandbox-qualification --json (@{
            operation = 'qualify'; packageDirectory = $package; target = $env:SANDBOX_TARGET
            evidenceDirectory = $evidence; workingDirectory = Join-Path $root 'work'
          } | ConvertTo-Json -Compress)
      - name: Retain selected native qualification evidence
        if: always() && env.BONSAI_SANDBOX_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-sandbox-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BONSAI_SANDBOX_EVIDENCE }}/*.json
            ${{ env.BONSAI_SANDBOX_EVIDENCE }}/*.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
