#:schema https://raw.githubusercontent.com/rvben/rumdl/main/rumdl.schema.json

[global]
flavor = "standard"
# Reject structural Markdown defects (broken links/fragments, unclosed/nested fences)
# without failing builds on stylistic prose, spacing or table-alignment preferences.
disable = [
    "MD001",
    "MD003",
    "MD004",
    "MD005",
    "MD007",
    "MD009",
    "MD010",
    "MD012",
    "MD013",
    "MD022",
    "MD024",
    "MD025",
    "MD026",
    "MD028",
    "MD029",
    "MD030",
    "MD031",
    "MD032",
    "MD033",
    "MD034",
    "MD035",
    "MD036",
    "MD041",
    "MD043",
    "MD044",
    "MD045",
    "MD046",
    "MD047",
    "MD048",
    "MD049",
    "MD050",
    "MD054",
    "MD055",
    "MD056",
    "MD058",
    "MD059",
    "MD060",
]
respect-gitignore = true
cache = false
exclude = [
    ".git",
    ".rumdl_cache",
    "target",
    "third_party",
]
extend-enable = [
    "MD070",
    "MD073",
    "MD080",
    "MD083",
    "MD084",
    "MD091",
    "MD095",
]

[MD040]
style = "consistent"
unknown-language-action = "ignore"
custom-languages = ["rust,no_run", "rust,ignore"]

[MD051]
anchor-style = "github"
